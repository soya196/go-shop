services:
  db:
    image: postgres:17-alpine
    container_name: go-shop-db
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      # ใช้ 5433 กันชนกับ postgres ที่อาจติดตั้งบนเครื่องอยู่แล้ว (5432)
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
